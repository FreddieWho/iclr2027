version: 1

model_families:
  coordinate:
    - deepsets
    - set_transformer_small
    - gat_small
  frozen_image:
    - dinov2_vits14
    - openclip_vit_b32
    - mae_vit_base
  geometry_baselines:
    - centering
    - procrustes
    - fixed_canonicalization
    - learned_canonicalization
  method:
    - cap
    - amr_fixed
    - amr_learned

intervention_axes:
  operators:
    football: [translation]
    basketball: [translation]
    calligraphy: [translation, rotation]
  energies: [0.25, 0.5, 1.0, 2.0]
  spectral_bands: 6
  support_sweep_fraction: [1.0, 0.75, 0.5, 0.25, 0.1]
  controls:
    - semantic_coalition
    - connected_random_subset
    - arbitrary_random_subset
    - frequency_matched_phase_randomized

causal_matrix:
  augmentation_coupling:
    - global_coupled
    - subgroup_coupled
    - node_independent
  constraint_type:
    - none
    - invariance
    - equivariance
  aggregation:
    - unary_mean
    - cls
    - relational_pairwise
    - graph_attention
  sampling:
    - natural
    - spectral_whitened
  route: optional_after_minimal_mechanism_gate

p3_support_conditioned_geometry:
  phase: P3_CAUSAL_MECHANISM
  status: document_locked_t0_not_run
  hypothesis_type: post_p2_mechanistic_follow_up
  fixed_assets:
    samples: 250
    models: 9
    match_grouped_unit: true
    p2_response_blind_prospective_generation: true
  t0_interface_provenance:
    - baseline_embedding_parity
    - normalized_embedding
    - node_encoder_and_message_passing_outputs
    - pooling_pre_and_pooled_outputs
    - autograd_jvp
    - finite_difference_and_second_order_smoke
    - checkpoint_and_input_immutability
  t1_prediction:
    target: [raw_representation_response, anchor_control_pair_effect, pair_direction, match_aggregate]
    predictors:
      - spectral_power
      - rayleigh_quotient
      - support_size
      - role_graph_architecture_epsilon
      - frequency_residual
      - topology_residual
      - diagonal_geometry
      - full_geometry
      - off_diagonal_geometry
    grouped_cv: leave_one_match_out_or_explicit_grouped_cv
    bootstrap_unit: source_match_id
  t2_prospective:
    response_blind: true
    same_assets_only: true
    new_intervention_seed: 20260901
    freeze_before_generation: [formula, layer, metrics, statistical_unit, failure_analysis]
  t3_localization:
    block_decomposition: [full, diagonal_only, off_diagonal, team_within, team_between, support_inside, support_outside, graph_edge, graph_non_edge]
    layers: [input_node, message_passing_1, message_passing_2, pooling_pre, pooled_embedding]
  t4_causal_switch:
    selection: evidence_selected_single_switch
    status: not_selected_until_t3
    full_causal_matrix: optional_after_minimal_mechanism_gate
  t5_task_alignment:
    tasks: [perturbation_localization, one_existing_non_intervention_label_task]
    intervention_label_as_main_task: forbidden

metrics:
  diagnostic:
    - structural_transfer_function
    - equal_energy_reversal_rate
    - semantic_coalition_gap
    - notch_depth
    - notch_position
    - directional_jacobian_rank
    - mode_accessibility_linear
  task:
    - intrinsic_retrieval
    - context_prediction
    - perturbation_localization
    - natural_pair_ranking
    - calligraphy_structure_matching
  reporting:
    - group_bootstrap_ci
    - effect_size
    - parameters
    - runtime

default_seeds: [11, 23, 47]

exploration_checkpoints:
  C1:
    question: "What matched-energy action-mode patterns appear in the available representations?"
    evidence_to_collect:
      - "ERRR, transfer curves, uncertainty and model-family differences"
      - "candidate monotonic or non-monotonic patterns, including null results"
  C2:
    question: "Does organization add information beyond graph frequency?"
    evidence_to_collect:
      - "semantic, connected-random, arbitrary-random and phase-randomized comparisons"
      - "effect sizes, group-bootstrap intervals and sensitivity to graph construction"
  C3:
    question: "Can support-conditioned local geometry predict, localize and mechanistically alter the P2 heterogeneity?"
    evidence_to_collect:
      - "normalized embedding Jacobian, full/diagonal/off-diagonal geometry and match-grouped prediction"
      - "prospective intervention validation, layer-wise localization, one selected causal switch and task-geometry alignment"
  C4:
    question: "What method designs improve the useful robustness-structure trade-off?"
    evidence_to_collect:
      - "CAP, canonicalization, relational pooling, AMR-Fixed and AMR-Learned comparisons"
      - "task performance, accessibility, capacity, runtime and failure cases"
  C5:
    question: "Which action-mode relationships, if any, transfer from sports to calligraphy?"
    evidence_to_collect:
      - "multiple band and mapping versions, with the exploration history retained"
      - "objective structure matching, perturbation localization and cross-domain failure cases"
