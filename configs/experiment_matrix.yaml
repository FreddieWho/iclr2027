version: 1

model_families:
  coordinate:
    - deepsets
    - set_transformer_small
    - gat_small
  frozen_image:
    - dinov2_vits14
    - openclip_vit_b32
    - mae_vit_base
  geometry_baselines:
    - centering
    - procrustes
    - fixed_canonicalization
    - learned_canonicalization
  method:
    - cap
    - amr_fixed
    - amr_learned

intervention_axes:
  operators:
    football: [translation]
    basketball: [translation]
    calligraphy: [translation, rotation]
  energies: [0.25, 0.5, 1.0, 2.0]
  spectral_bands: 6
  support_sweep_fraction: [1.0, 0.75, 0.5, 0.25, 0.1]
  controls:
    - semantic_coalition
    - connected_random_subset
    - arbitrary_random_subset
    - frequency_matched_phase_randomized

causal_matrix:
  augmentation_coupling:
    - global_coupled
    - subgroup_coupled
    - node_independent
  constraint_type:
    - none
    - invariance
    - equivariance
  aggregation:
    - unary_mean
    - cls
    - relational_pairwise
    - graph_attention
  sampling:
    - natural
    - spectral_whitened
  route: optional_after_minimal_mechanism_gate

p3_support_conditioned_geometry:
  phase: P3_CAUSAL_MECHANISM
  status: t0_t5_complete_response_shaping_only_p4_gate_not_met
  hypothesis_type: post_p2_mechanistic_follow_up
  fixed_assets:
    samples: 250
    models: 9
    match_grouped_unit: true
    p2_response_blind_prospective_generation: true
  t0_interface_provenance:
    - baseline_embedding_parity
    - normalized_embedding
    - node_encoder_and_message_passing_outputs
    - pooling_pre_and_pooled_outputs
    - autograd_jvp
    - finite_difference_and_second_order_smoke
    - checkpoint_and_input_immutability
  t1_prediction:
    target: [raw_representation_response, anchor_control_pair_effect, pair_direction, match_aggregate]
    predictors:
      - spectral_power
      - rayleigh_quotient
      - support_size
      - role_graph_architecture_epsilon
      - frequency_residual
      - topology_residual
      - diagonal_geometry
      - full_geometry
      - off_diagonal_geometry
    grouped_cv: leave_one_match_out_or_explicit_grouped_cv
    bootstrap_unit: source_match_id
  t2_prospective:
    response_blind: true
    same_assets_only: true
    new_intervention_seed: 20260901
    freeze_before_generation: [formula, layer, metrics, statistical_unit, failure_analysis]
  t3_localization:
    block_decomposition: [full, diagonal_only, off_diagonal, team_within, team_between, support_inside, support_outside, graph_edge, graph_non_edge]
    layers: [input_node, message_passing_1, message_passing_2, pooling_pre, pooled_embedding]
  t4_causal_switch:
    selection: evidence_selected_single_switch
    status: pooling_accessibility_executed_response_shaping_only
    task_gate: not_met
    full_causal_matrix: optional_after_minimal_mechanism_gate
  t5_task_alignment:
    tasks: [perturbation_localization, one_existing_non_intervention_label_task]
    intervention_label_as_main_task: forbidden
    status: no_stable_objective_task_gain_and_context_robustness_tradeoff_worsened

metrics:
  diagnostic:
    - structural_transfer_function
    - equal_energy_reversal_rate
    - semantic_coalition_gap
    - notch_depth
    - notch_position
    - directional_jacobian_rank
    - mode_accessibility_linear
  task:
    - intrinsic_retrieval
    - context_prediction
    - perturbation_localization
    - natural_pair_ranking
    - calligraphy_structure_matching
  reporting:
    - group_bootstrap_ci
    - effect_size
    - parameters
    - runtime

default_seeds: [11, 23, 47]

exploration_checkpoints:
  C1:
    question: "What matched-energy action-mode patterns appear in the available representations?"
    evidence_to_collect:
      - "ERRR, transfer curves, uncertainty and model-family differences"
      - "candidate monotonic or non-monotonic patterns, including null results"
  C2:
    question: "Does organization add information beyond graph frequency?"
    evidence_to_collect:
      - "semantic, connected-random, arbitrary-random and phase-randomized comparisons"
      - "effect sizes, group-bootstrap intervals and sensitivity to graph construction"
  C3:
    question: "Can support-conditioned local geometry predict, localize and mechanistically alter the P2 heterogeneity?"
    evidence_to_collect:
      - "normalized embedding Jacobian, full/diagonal/off-diagonal geometry and match-grouped prediction"
      - "prospective intervention validation, layer-wise localization, one selected causal switch and task-geometry alignment"
  C4:
    question: "What method designs improve the useful robustness-structure trade-off?"
    evidence_to_collect:
      - "CAP, canonicalization, relational pooling, AMR-Fixed and AMR-Learned comparisons"
      - "task performance, accessibility, capacity, runtime and failure cases"
  C5:
    question: "Which action-mode relationships, if any, transfer from sports to calligraphy?"
    evidence_to_collect:
      - "multiple band and mapping versions, with the exploration history retained"
      - "objective structure matching, perturbation localization and cross-domain failure cases"

# This is a task lane inside the existing P3_CAUSAL_MECHANISM phase, not a new phase.
p3_task_semantic_repair:
  phase: P3_CAUSAL_MECHANISM
  task_lane: P3-T5R
  status: t5r4_round1_complete_review_required
  protocol_config: configs/phase3_task_semantic_repair_v1.yaml
  package: docs/ICLR2027_P3_REPAIR_PACKAGE_20260902/
  legacy_heldout:
    status: EXPOSED_DURING_CANDIDATE_SEARCH
    allowed_use: exploratory_audit_only
    candidate_selection: forbidden
  data:
    development:
      dataset: IDSSE
      source: https://huggingface.co/datasets/pysport/idsse-data
      raw_path: data/raw/sports/idsse-data
      matches: 7
      role: temporary_substitute_for_sngar_development
      official_revision: a715a38dfbaf5f58e431727c2b78d174101a703c
      official_file_tree_matches_local: true
      split_policy: match_level_split_frozen_before_task_construction
      train_matches: [J03WMX, J03WOH, J03WPY, J03WR9]
      valid_matches: [J03WN1, J03WOY]
      reserved_holdout_matches: [J03WQQ]
      task_manifest: artifacts/phase3/task_semantic_repair_v1/task_manifest.json
      baseline_and_metric_lock: artifacts/phase3/task_semantic_repair_v1/baseline_and_metric_lock.json
      t5r3_sanity_report: reports/P3_T5R3_SANITY_REPORT.md
      t5r3_sanity_output: artifacts/phase3/task_semantic_repair_v1/t5r3_sanity_v3/
      t5r3_closure_review: reports/P3_T5R3_CLOSURE_REVIEW.md
      t5r4_round1_config: configs/t5r4_round1.yaml
      t5r4_round1_output: artifacts/phase3/task_semantic_repair_v1/t5r4_round1_v1/
      t5r4_round1_report: reports/P3_T5R4_ROUND1_REPORT.md
    deferred_sngar:
      dataset: SNGAR-Action-Spotting-Tracking
      access_status: blocked_external_network_2026-09-02
      role: deferred_development_and_future_independent_confirmation
    hidden_same_source:
      dataset: IDSSE
      policy: candidate_lock_then_single_reserved_match_read
      note: same_source_holdout_not_independent_provider_confirmation
    external:
      dataset: SNGAR-test-or-SoccerTrack-v2
      policy: candidate_lock_then_independent_confirmation
    historical:
      dataset: SkillCorner_Open_Data
      matches: 10
      policy: dynamic_support_rule_development_only
  tasks:
    context:
      tasks:
        - phase_or_deployment_classification
        - absolute_team_centroid_or_field_zone
      representation: z_ctx
      translation_requirement: preserve_context_accessibility
    intrinsic:
      tasks:
        - natural_pair_ranking
        - intrinsic_formation_retrieval
      representation: z_mode
      translation_requirement: global_translation_robustness
    dynamic_support:
      status: non_blocking_parallel
      response_blind: true
  model:
    architecture: shared_encoder_fixed_dual_channel
    raw_view: z_ctx
    centered_view: z_mode
    context_head_reads: z_ctx_only
    intrinsic_head_reads: z_mode_only
    cross_readout: leakage_audit_only
  baselines:
    - raw_single_channel_team_mean
    - centered_single_channel
    - raw_relational_pooling
    - fixed_dual_channel
    - raw_coordinates_or_procrustes
  metrics:
    primary_unit: source_match_id
    context: [macro_f1, accuracy_or_regression_error, accessibility]
    intrinsic: [ranking_accuracy, mrr, recall_at_k, hard_negative_performance]
    mode_robustness: [global_translation_response]
    geometry: [full_spearman, diagonal_spearman, off_diagonal_spearman]
    statistics: [match_bootstrap_ci, leave_one_match_out, seed_level_effect]
  autoresearch:
    max_rounds: 2
    max_new_candidates_per_round: 6
    min_seeds: [11, 23, 47]
    one_major_axis_per_candidate: true
    heldout_or_external_results_during_search: forbidden
    architecture_zoo: forbidden
  candidate_lock:
    required_before_test: true
    schema: docs/ICLR2027_P3_REPAIR_PACKAGE_20260902/templates/candidate_lock.schema.json
    required_status: NOT_CREATED
    note: T5R2 lock is closed; candidate lock remains required before any reserved/test read
  gate:
    p4_entry_requires_all:
      - geometry_prediction_on_unseen_matches
      - context_task_noninferiority
      - intrinsic_task_improvement
      - z_mode_translation_robustness
      - majority_seed_and_match_consistency
      - unseen_match_or_reserved_holdout_confirmation
      - independent_provider_confirmation_after_development
      - no_test_leakage_role_oracle_or_capacity_shortcut
      - fixed_non_posterior_routing_rule
    failure_route: diagnostic_mechanistic_version_and_stop_amr
  optional_after_minimal_mechanism_gate:
    - full_augmentation_pooling_constraint_matrix
