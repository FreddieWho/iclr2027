version: 2
root: data/raw

policy:
  primary_statistical_unit: source_match_id
  frame_level_independence_forbidden: true
  event_level_independence_forbidden: true
  legacy_heldout_status: EXPOSED_DURING_CANDIDATE_SEARCH
  legacy_heldout_allowed_use: exploratory_audit_only
  final_test_requires_candidate_lock: true
  gated_data_access_not_assumed: true
  p2_artifacts_read_only: true
  calligraphy_cannot_select_sports_mechanism: true
  temporary_sngar_development_substitute: IDSSE
  temporary_substitution_scope: development_only

datasets:
  skillcorner:
    priority: P0
    required: true
    path: sports/skillcorner
    markers:
      - data/matches.json
    source: https://github.com/SkillCorner/opendata
    license_note: MIT repository; cite SkillCorner and recheck data terms

  metrica:
    priority: P1
    required: false
    path: sports/metrica
    markers:
      - Sample_Game_1
    source: https://github.com/metrica-sports/sample-data

  trackid3x3_repo:
    priority: P2
    required: false
    path: sports/trackid3x3_repo
    markers:
      - README.md
    source: https://github.com/open-starlab/TrackID3x3

  makemeahanzi:
    priority: P0
    required: true
    path: calligraphy/makemeahanzi
    markers:
      - dictionary.txt
      - graphics.txt
    source: https://github.com/skishore/makemeahanzi
    license_note: mixed source licenses; preserve COPYING/APL/LGPL

  mccd_repo:
    priority: P1
    required: false
    path: calligraphy/MCCD_repo
    markers:
      - README.md
    source: https://github.com/SCUT-DLVCLab/MCCD
    license_note: data requires application; CC BY-NC-ND 4.0 non-commercial

  zhuojg_repo:
    priority: P0
    required: false
    path: calligraphy/zhuojg_repo
    markers:
      - dataset-pytorch.py
    source: https://github.com/zhuojg/chinese-calligraphy-dataset

  kirosc:
    priority: P0
    required: false
    path: calligraphy/kirosc
    markers:
      - data-jpg.7z
    source: https://github.com/kirosc/chinese-calligraphy-dataset
    license_note: GPL-3.0

  ccse_repo:
    priority: P1
    required: false
    path: calligraphy/CCSE_repo
    markers:
      - README.md
    source: https://github.com/lizhaoliu-Lec/CCSE

  mathwriting_excerpt:
    priority: fallback
    required: false
    path: mathwriting
    markers:
      - mathwriting-2024-excerpt.tgz
    source: https://storage.googleapis.com/mathwriting_data/mathwriting-2024-excerpt.tgz
    license_note: CC BY-NC-SA 4.0

  sngar_tracking:
    priority: A0
    required: false
    path: sports/sngar_tracking
    markers:
      - README.md
      - MANIFEST.sha256
    source: https://huggingface.co/datasets/OpenSportsLab/SNGAR-Action-Spotting-Tracking
    access: gated_huggingface
    status: deferred_while_idsse_substitute_active
    access_probe_status: blocked_external_network_2026-09-02
    local_data_present: false
    split_policy: deferred_train_valid_development_only_until_candidate_lock
    test_policy: test_requires_candidate_lock
    license_note: respect gated access terms; do not redistribute raw data

  skillcorner_open:
    priority: A1
    required: false
    path: sports/skillcorner
    markers:
      - data/matches.json
    source: https://github.com/SkillCorner/opendata
    status: existing_historical_asset
    final_confirmation_allowed: false
    license_note: historical exploratory/dynamic-support rule development only

  idsse:
    priority: A0_TEMPORARY_SUBSTITUTE
    required: false
    path: sports/idsse-data
    markers:
      - README.md
      - .gitattributes
    source: https://huggingface.co/datasets/pysport/idsse-data
    original_source: https://springernature.figshare.com/articles/dataset/An_integrated_dataset_of_spatiotemporal_and_event_data_in_elite_soccer/28196177
    access: open_huggingface
    status: canonical_conversion_complete_t5r2_lock_complete
    local_data_present: true
    match_count: 7
    official_revision: a715a38dfbaf5f58e431727c2b78d174101a703c
    official_file_tree_matches_local: true
    official_card_id_note: card_text_lists_J03WPF_and_J03WQF_file_tree_lists_J03WQQ_and_J03WR9
    viewer_status: unavailable_features_error_file_not_found_for_default_train
    role: temporary_development_substitute_for_sngar
    split_policy: match_level_split_frozen_before_task_construction
    split_lock: artifacts/phase3/task_semantic_repair_v1/split_lock.json
    source_manifest: artifacts/data_v2/idsse/source_file_manifest.json
    sha256sums: artifacts/data_v2/idsse/RAW_SHA256SUMS
    canonical_manifest: artifacts/data_v2/idsse/canonical_manifest.json
    task_manifest: artifacts/phase3/task_semantic_repair_v1/task_manifest.json
    baseline_and_metric_lock: artifacts/phase3/task_semantic_repair_v1/baseline_and_metric_lock.json
    external_confirmation_allowed_in_same_run: false
    license_note: CC BY 4.0; preserve download receipt and source checksums

  soccertrack_v2_smoke:
    priority: B1
    required: false
    path: sports/soccertrack_v2_smoke
    markers: []
    source: https://huggingface.co/datasets/atomscott/soccertrack-v2
    access: gated_huggingface
    status: parser_smoke_only

  soccertrack_v2:
    priority: B1
    required: false
    path: sports/soccertrack_v2
    markers: []
    source: https://huggingface.co/datasets/atomscott/soccertrack-v2
    access: gated_huggingface
    status: candidate_lock_required
    split_policy: acquisition_shift_confirmation_only
