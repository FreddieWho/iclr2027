version: 1
project: action-mode-spectrum
phase: P3_CAUSAL_MECHANISM
task_lane: P3-T5R
status: t5r4_round2_complete_autoresearch_closed
package: docs/ICLR2027_P3_REPAIR_PACKAGE_20260902/

legacy_evidence:
  old_task_gate: NOT_SUPPORTED_UNDER_OLD_CONFLATED_TASK_GATE
  old_heldout_status: EXPOSED_DURING_CANDIDATE_SEARCH
  old_heldout_allowed_use: exploratory_audit_only
  p2_artifacts_read_only: true
  p3_geometry_artifacts_read_only: true

data:
  development:
    dataset_id: IDSSE
    source: https://huggingface.co/datasets/pysport/idsse-data
    original_source: https://springernature.figshare.com/articles/dataset/An_integrated_dataset_of_spatiotemporal_and_event_data_in_elite_soccer/28196177
    access_status: official_page_verified_canonical_conversion_and_qc_complete
    raw_path: data/raw/sports/idsse-data
    match_count: 7
    official_revision: a715a38dfbaf5f58e431727c2b78d174101a703c
    official_file_tree_matches_local: true
    official_card_id_note: card_text_lists_J03WPF_and_J03WQF_file_tree_lists_J03WQQ_and_J03WR9
    viewer_status: unavailable_features_error_file_not_found_for_default_train
    role: temporary_substitute_for_sngar_development
    split_policy: match_level_split_frozen_before_task_construction
    train_matches: [J03WMX, J03WOH, J03WPY, J03WR9]
    valid_matches: [J03WN1, J03WOY]
    heldout_matches: [J03WQQ]
    search_splits: train_and_valid_only
    test_policy: no_official_hidden_split; reserved_match_read_only_after_candidate_lock
    time_column: source_native_event_and_frame_time
    raw_manifest: artifacts/data_v2/idsse/source_file_manifest.json
    raw_sha256sums: artifacts/data_v2/idsse/RAW_SHA256SUMS
    canonical_manifest: artifacts/data_v2/idsse/canonical_manifest.json
    conversion_receipts: artifacts/data_v2/idsse/canonical/conversion_receipts/
  deferred_sngar:
    dataset_id: SNGAR-Action-Spotting-Tracking
    source: https://huggingface.co/datasets/OpenSportsLab/SNGAR-Action-Spotting-Tracking
    access_status: blocked_external_network_2026-09-02
    role: deferred_primary_development_and_future_independent_confirmation
  historical_dynamic_support:
    dataset_id: SkillCorner_Open_Data
    source: https://github.com/SkillCorner/opendata
    status: existing_historical_asset
    final_confirmation_allowed: false
  external_confirmation:
    dataset_id: IDSSE
    source: https://huggingface.co/datasets/pysport/idsse-data
    matches: 7
    status: unavailable_as_independent_confirmation_after_development_substitution
    policy: do_not_reuse_development_matches_as_external_confirmation
  independent_confirmation:
    dataset_id: SNGAR-test-or-SoccerTrack-v2
    status: pending_after_idsse_development_branch
    policy: candidate_lock_before_any_reserved_holdout_or_external_result
  acquisition_shift:
    dataset_id: SoccerTrack_v2
    source: https://huggingface.co/datasets/atomscott/soccertrack-v2
    smoke_matches: [117092, 117093]
    status: parser_smoke_only_until_candidate_lock

split_lock:
  primary_unit: source_match_id
  cross_match_frame_split_forbidden: true
  cross_event_split_forbidden: true
  train_valid_only_during_search: true
  final_test_labels_available_during_search: false
  external_results_available_during_search: false

tasks:
  context:
    primary:
      - phase_or_deployment_classification  # display: match-half context probe; see metric_semantics_addendum.json
      - absolute_team_centroid_or_field_zone
    semantic_alias: match_half_context_probe  # firstHalf/secondHalf labels; not tactical-phase understanding
    representation: z_ctx
    input_view: raw_positions
    global_translation_semantics: preserve_context_accessibility
  intrinsic:
    primary:
      - natural_pair_ranking  # display: intrinsic structural accessibility proxy (geometry-constructed); Procrustes ceiling ~0.9372
    secondary:
      - intrinsic_formation_retrieval
    representation: z_mode
    input_view: globally_centered_positions
    global_translation_semantics: robust_nuisance_invariance
    intervention_label_as_main_task: false
  dynamic_support:
    status: non_blocking_parallel
    response_blind: true

model:
  encoder: shared_phase_gat_or_locked_equivalent
  channels:
    context: raw_positions_to_z_ctx
    mode: centered_positions_to_z_mode
  context_head_reads: [z_ctx]
  intrinsic_head_reads: [z_mode]
  cross_readouts: leakage_audit_only
  role_as_required_runtime_input: false

baselines:
  - raw_single_channel_team_mean
  - centered_single_channel
  - raw_relational_pooling
  - fixed_dual_channel
  - raw_coordinates_or_procrustes

training_lock:
  seeds: [11, 23, 47]
  optimizer: Adam
  learning_rate: 0.001
  weight_decay: 0
  epochs: 80
  batch_size: 64
  latent_dim: 128
  hidden_dim: 128
  message_passing_layers: 2
  augmentation: none
  early_stopping: false
  class_weighting: false
  parameter_matching: required
  noninferiority_margin:
    status: locked_in_artifacts/phase3/task_semantic_repair_v1/baseline_and_metric_lock.json
    context_metric: context_task_primary
    macro_f1_absolute_drop_max: 0.05
    centroid_mae_increase_max: 0.05

metrics:
  primary_statistical_unit: source_match_id
  context:
    - macro_f1
    - accuracy_or_regression_error
    - absolute_deployment_accessibility
  intrinsic:
    - match_grouped_ranking_accuracy
    - mrr_or_recall_at_k
    - hard_negative_performance
  robustness:
    - z_mode_global_translation_response
    - z_ctx_context_accessibility
  geometry:
    - full_geometry_response_spearman
    - diagonal_geometry_response_spearman
    - off_diagonal_geometry_response_spearman
  statistics:
    - match_bootstrap_ci
    - leave_one_match_out_sensitivity
    - seed_level_effect

autoresearch:
  status: round_2_complete_autoresearch_closed
  round_1_config: configs/t5r4_round1.yaml
  round_1_output: artifacts/phase3/task_semantic_repair_v1/t5r4_round1_v1/
  round_1_report: reports/P3_T5R4_ROUND1_REPORT.md
  round_2_config: configs/t5r4_round2.yaml
  round_2_output: artifacts/phase3/task_semantic_repair_v1/t5r4_round2_v1/
  round_2_report: reports/P3_T5R4_ROUND2_REPORT.md
  round_2_review_authorization: reports/P3_T5R4_ROUND1_REVIEW_AND_ROUND2_AUTHORIZATION.md
  selected_candidate: update_ratio_2to1
  max_rounds: 2
  max_new_candidates_per_round: 6
  one_major_mechanism_axis_per_candidate: true
  round_1_axes: [loss_balance, head_placement, gradient_routing, fixed_leakage_penalty]
  round_2_requires_round_1_stable_signal: true  # satisfied narrowly: intrinsic-gradient-must-shape-encoder mechanistic signal, not a Pareto win
  round_2_axes: [shared_encoder_task_update_balance]  # authorized override of the earlier [pooling, constraint_placement] placeholder; see D-20260904-P3-023
  heldout_selection: forbidden
  external_result_selection: forbidden
  metric_or_split_changes: forbidden
  architecture_zoo: forbidden

candidate_lock:
  required_before_test: true
  status: NOT_CREATED
  schema: docs/ICLR2027_P3_REPAIR_PACKAGE_20260902/templates/candidate_lock.schema.json
  output: artifacts/phase3/task_semantic_repair_v1/candidate_lock.json

firewall:
  legacy_heldout: exploratory_audit_only
  sngar_test_files_present_during_search: false
  sngar_test_labels_read_during_search: false
  idsse_development_data_allowed_during_search: true
  idsse_external_confirmation_results_read_during_search: false
  idsse_results_read_during_search: false
  soccertrack_final_results_read_during_search: false
  candidate_lock_required_for_test_download: true

artifacts:
  root: artifacts/phase3/task_semantic_repair_v1/
  plan_report: reports/P3_TASK_SEMANTIC_REPAIR_PLAN.md
  results_report: reports/P3_TASK_SEMANTIC_REPAIR_RESULTS.md
  final_decision: reports/P3_T5R_FINAL_DECISION.md
  source_provenance: artifacts/data_v2/idsse/source_provenance.json
  split_lock: artifacts/phase3/task_semantic_repair_v1/split_lock.json
  task_manifest: artifacts/phase3/task_semantic_repair_v1/task_manifest.json
  baseline_and_metric_lock: artifacts/phase3/task_semantic_repair_v1/baseline_and_metric_lock.json
  t5r2_audit: scripts/audit_idsse_t5r2.py
  t5r3_runner: scripts/run_t5r3_sanity.py
  t5r3_report: reports/P3_T5R3_SANITY_REPORT.md
  t5r3_audit: scripts/audit_t5r3_sanity.py
  t5r3_output: artifacts/phase3/task_semantic_repair_v1/t5r3_sanity_v3/
  t5r3_closure_review: reports/P3_T5R3_CLOSURE_REVIEW.md
  t5r4_round1_config: configs/t5r4_round1.yaml
  t5r4_round1_runner: scripts/run_t5r4_round1.py
  t5r4_round1_audit: scripts/audit_t5r4_round1.py
  t5r4_round1_output: artifacts/phase3/task_semantic_repair_v1/t5r4_round1_v1/
  t5r4_round1_report: reports/P3_T5R4_ROUND1_REPORT.md
  t5r4_round2_config: configs/t5r4_round2.yaml
  t5r4_round2_runner: scripts/run_t5r4_round2.py
  t5r4_round2_audit: scripts/audit_t5r4_round2.py
  t5r4_round2_output: artifacts/phase3/task_semantic_repair_v1/t5r4_round2_v1/
  t5r4_round2_report: reports/P3_T5R4_ROUND2_REPORT.md
  t5r4_review_authorization: reports/P3_T5R4_ROUND1_REVIEW_AND_ROUND2_AUTHORIZATION.md
  metric_semantics_addendum: artifacts/phase3/task_semantic_repair_v1/metric_semantics_addendum.json

gate:
  p4_requires:
    - unseen_match_geometry_prediction
    - context_task_noninferiority
    - intrinsic_task_improvement
    - z_mode_translation_robustness
    - majority_seed_and_match_consistency
    - unseen_match_or_reserved_holdout_confirmation
    - independent_provider_confirmation_after_development
    - no_leakage_role_oracle_or_capacity_shortcut
    - fixed_non_posterior_routing_rule
  failure_route: NOT_SUPPORTED_OR_DIAGNOSTIC_MECHANISTIC_VERSION
