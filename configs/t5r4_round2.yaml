decision_rules:
  qualification_gate:
    - satisfies_original_t5r2_context_noninferiority_contract
    - z_mode_translation_response_stays_numerical_zero_audit_threshold_mean_below_1e-6
    - natural_pair_ranking_accuracy_within_reference_minus_0.01
    - natural_geometry_latent_spearman_within_reference_minus_0.01
    - at_least_2_of_3_seeds_hold_both_intrinsic_floors
    - no_mean_gain_driven_by_single_seed_only
    - no_promotion_on_match_half_f1_alone
    - no_promotion_on_near_procrustes_ceiling_micro_gain_alone
  incumbent_replacement_requires_clear_task_geometry_pareto:
    strong_A: geometry_latent_spearman_stably_up_with_pair_and_context_not_substantially_degraded
    strong_B: absolute_context_field_zone_or_centroid_stably_improved_with_geometry_and_pair_held
    stability_means:
      - at_least_2_of_3_seeds_same_direction
      - not_driven_by_single_match_with_opposite_other_match
      - report_same_seed_and_match_level_comparisons_not_grand_mean_only
  forbidden_promotion_reasons:
    - higher_match_half_f1_only
    - pair_accuracy_up_0.1_to_0.5_percent_only
    - higher_train_metrics_only
    - lower_total_loss_only
    - single_seed_outlier_only
    - classification_up_geometry_down
    - looks_more_balanced
  no_winner_outcome: T5R4_ROUND2_NO_CLEAR_PARETO_incumbent_stays_t5r3_fixed_dual
  winner_outcome: T5R4_selected_candidate_then_close_autoresearch_no_third_round_no_ratio_finetune

