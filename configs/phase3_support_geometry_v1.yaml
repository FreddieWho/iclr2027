geometry:
  object: normalized_embedding
  normalization: l2
  distance: cosine_distance
  local_metric: G_f_equals_J_transpose_J
  q_definition: half_norm_J_delta_squared
  derivative: autograd_jacobian_and_jvp
  full_jacobian: true
  jvp_smoke: true
  finite_difference: centered
  finite_difference_steps: [0.0001, 0.0005]
  tangent_epsilons: [0.0001, 0.0005, 0.001]
  p2_response_epsilons: [0.25, 0.5]
  nonlinear_extension:
    enabled: false
    name: integrated_jacobian_path_energy
    points: 3
    condition: only_if_small_epsilon_wins_and_residual_is_path_nonlinear

layers:
  requested:
    - input_node
    - message_passing_1
    - message_passing_2
    - pooling_pre
    - pooled_embedding
  comparison_rule: normalized_output_or_matched_direction_scale
  projection_head: not_used_in_p2_embedding
  graph_policy: reuse_p2_baseline_fixed_weighted_knn4

t1_prediction:
  response_targets:
    - raw_representation_response
    - anchor_control_pair_effect
    - pair_effect_direction
    - match_level_aggregate_direction_and_magnitude
  predictor_families:
    - spectral_power
    - rayleigh_quotient
    - support_size
    - role_graph_architecture_epsilon
    - frequency_residual
    - topology_residual
    - low_degree_linear_combination
    - diagonal_geometry
    - full_geometry
    - off_diagonal_geometry
  model_complexity: low_degree_linear_or_rank_preserving
  grouped_cv: leave_one_source_match_out
  grouping_key: source_match_id
  bootstrap_unit: source_match_id
  no_large_learned_predictor: true
  report_metrics: [spearman, mae, r2, direction_accuracy, calibration]

t2_prospective:
  response_blind: true
  same_assets_only: true
  operator: p2_fracture_endpoint_reallocation_v1
  energy_range: [0.25, 0.5]
  new_intervention_seed: 20260901
  freeze_before_response: [formula, layer, metrics, statistical_unit, failure_analysis]
  no_response_based_selection: true

t3_localization:
  blocks:
    - full
    - diagonal_only
    - off_diagonal
    - team_within
    - team_between
    - support_inside
    - support_outside
    - graph_edge
    - graph_non_edge
  role_use: descriptive_stratification_only
  directional_jacobian_rank: normalized_singular_value_threshold_reported_not_selected

t4_causal_switch:
  selection: evidence_selected_single_switch
  status: not_selected_until_t3
  matched_capacity: required
  seeds_required: 3
  possible_routes: [pooling_accessibility, interaction_coupling, constraint_placement]
  full_causal_matrix: optional_after_minimal_mechanism_gate

t5_task_alignment:
  task_definitions_locked_before_method_results: true
  required:
    - perturbation_localization
    - one_existing_non_intervention_label_task
  intervention_label_as_main_task: forbidden
  preferred_existing_tasks: [phase_or_deployment_label, natural_pair_ranking, intrinsic_formation_retrieval, context_prediction]

prospective:
  manifest_path: artifacts/phase3/support_geometry_prospective_v1/intervention_manifest.json
  response_path: artifacts/phase3/support_geometry_prospective_v1/
  design_checksum_required_before_response: true

artifacts:
