gates:
  p4_amr_fixed:
    all_required:
      - full_geometry_beats_best_frequency_residual_baseline_retrospective
      - full_geometry_beats_best_frequency_residual_baseline_prospective
      - interpretable_layer_or_block_mechanism
      - one_matched_causal_switch_changes_geometry_response_and_objective_task
      - stability_in_two_architectures_or_explicit_family
      - no_leakage_role_oracle_or_capacity_artifact
  conditional_support:
    diagonal_only: node_or_support_sensitivity_anisotropy_only
    single_architecture: architecture_limited_claim
    retrospective_only: descriptive_anatomy_no_amr
    response_only: representation_shaping_no_repair
  unsupported:
    stop: true
    preserve_p2_claim: mixed_or_graph_specific
    do_not_train_amr: true
